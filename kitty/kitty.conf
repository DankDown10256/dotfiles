# kitty.conf — minimal dark workstation setup
# Hyprland / Wayland oriented, keyboard-first, no visual noise.

# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

disable_ligatures cursor

# Slightly roomier line spacing without wasting vertical space.
modify_font cell_height 105%

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------

cursor                  #e8e8e8
cursor_text_color       #101012
cursor_shape            block
cursor_blink_interval   0
cursor_stop_blinking_after 0

# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------

window_padding_width    8
window_margin_width     0

# Hyprland already handles borders/decorations.
hide_window_decorations yes

# Keep the terminal visually stable when resizing.
resize_debounce_time    0.05

# No artificial gap between kitty splits.
window_border_width     1
draw_minimal_borders    yes
active_border_color     #55555f
inactive_border_color   #25252b

# -----------------------------------------------------------------------------
# Background
# -----------------------------------------------------------------------------

background              #0c0c0e
foreground              #e8e8e8

# Slight transparency: enough to integrate with Hyprland blur without
# sacrificing terminal readability.
background_opacity      0.94
dynamic_background_opacity yes

# -----------------------------------------------------------------------------
# Selection
# -----------------------------------------------------------------------------

selection_foreground    #f2f2f2
selection_background    #3a3a42

# -----------------------------------------------------------------------------
# URL / links
# -----------------------------------------------------------------------------

url_color               #9aa7bd
url_style               single
open_url_with           default
detect_urls             yes

# -----------------------------------------------------------------------------
# Tabs
# -----------------------------------------------------------------------------

# Do not waste vertical space for a single terminal.
tab_bar_min_tabs        2
tab_bar_edge            top
tab_bar_style           separator
tab_separator           "  │  "

tab_title_template      "{title}"
active_tab_title_template "{title}"

active_tab_foreground   #f2f2f2
active_tab_background   #24242a
active_tab_font_style   bold

inactive_tab_foreground #8d8d96
inactive_tab_background #111114
inactive_tab_font_style normal

tab_bar_background      #0c0c0e
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 4.0

# -----------------------------------------------------------------------------
# Scrollback
# -----------------------------------------------------------------------------

scrollback_lines        10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0

# Pipe large scrollback into less when requested.
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------

mouse_hide_wait         2.0
focus_follows_mouse     no

# -----------------------------------------------------------------------------
# Bell / notifications
# -----------------------------------------------------------------------------

enable_audio_bell       no
visual_bell_duration    0
window_alert_on_bell    no
bell_on_tab             ""

# -----------------------------------------------------------------------------
# Terminal behavior
# -----------------------------------------------------------------------------

term                    xterm-kitty
shell_integration       enabled

confirm_os_window_close 0
remember_window_size    no
initial_window_width    100c
initial_window_height   30c

# Keep pasted text literal and avoid accidental formatting surprises.
strip_trailing_spaces   smart

# -----------------------------------------------------------------------------
# Colors
# -----------------------------------------------------------------------------
# Mostly neutral palette, with subdued ANSI colors so diagnostics, git,
# compilers and TUIs remain readable without turning the terminal into RGB soup.

color0   #171719
color8   #595961

color1   #d46a6a
color9   #e07a7a

color2   #8fb573
color10  #a3c985

color3   #d0aa68
color11  #dfbc78

color4   #7697c7
color12  #8ca9d4

color5   #ae83c4
color13  #be94d2

color6   #70aaa6
color14  #82bbb7

color7   #c7c7ca
color15  #f0f0f2

# -----------------------------------------------------------------------------
# Keyboard
# -----------------------------------------------------------------------------
# Keep kitty-specific mappings small. Shell/editor/tmux bindings should remain
# predictable instead of kitty swallowing half the keyboard.

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab

map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

map ctrl+plus        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------

repaint_delay        8
input_delay          2
sync_to_monitor      yes

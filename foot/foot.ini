# foot.ini — minimal dark workstation setup
# Hyprland / Wayland oriented, keyboard-first, no visual noise.

[main]
shell = dsh
# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------

font=JetBrainsMono Nerd Font:size=11

# Slightly roomier line spacing.
line-height=16

# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------

pad=8x8
resize-delay-ms=50

# Slight transparency — Hyprland handles blur.
#alpha=0.94

# Initial size
initial-window-size-pixels=1000x600

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------

[cursor]

style=block
blink=no

# -----------------------------------------------------------------------------
# Scrollback
# -----------------------------------------------------------------------------

[scrollback]

lines=10000
multiplier=3.0

# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------

[mouse]

hide-when-typing=yes

# -----------------------------------------------------------------------------
# Bell
# -----------------------------------------------------------------------------

[bell]

urgent=no
notify=no

# -----------------------------------------------------------------------------
# URL / Links
# -----------------------------------------------------------------------------

[url]

launch=xdg-open ${url}

# -----------------------------------------------------------------------------
# Colors
# -----------------------------------------------------------------------------

[colors-dark]

alpha=0.94

# Normal
regular0=171719
regular1=d46a6a
regular2=8fb573
regular3=d0aa68
regular4=7697c7
regular5=ae83c4
regular6=70aaa6
regular7=c7c7ca

# Bright
bright0=595961
bright1=e07a7a
bright2=a3c985
bright3=dfbc78
bright4=8ca9d4
bright5=be94d2
bright6=82bbb7
bright7=f0f0f2

# Default foreground/background
foreground=e8e8e8
background=0c0c0e

# Selection
selection-foreground=f2f2f2
selection-background=3a3a42

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

[key-bindings]

clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

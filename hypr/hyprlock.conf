$cream = rgb(eee5d8)
$muted = rgb(b7a394)
$orange = rgb(d98b68)

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(241c18)
}

shape {
    monitor =
    size = 48, 4
    color = $orange
    rounding = 2
    position = 0, 235
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $cream
    font_size = 100
    font_family = Noto Serif
    position = 0, 135
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A %d %B'
    color = $muted
    font_size = 15
    font_family = Noto Sans
    position = 0, 48
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $cream
    font_size = 20
    font_family = Noto Sans
    position = 0, -38
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 310, 58
    outline_thickness = 2

    outer_color = rgb(755344)
    inner_color = rgb(30241e)
    font_color = $cream
    font_family = Noto Sans

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false
    placeholder_text = <span foreground="##b7a394">Mot de passe</span>
    fail_text = <span foreground="##eee5d8">Mot de passe incorrect</span>

    check_color = $orange
    fail_color = rgb(c56b59)
    capslock_color = rgb(e3b176)

    rounding = 16
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then playerctl -p "$p" metadata xesam:title 2>/dev/null | cut -c 1-45 | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g'; break; fi; done
    color = $orange
    font_size = 17
    font_family = Noto Sans Medium
    position = 0, -205
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then playerctl -p "$p" metadata xesam:artist 2>/dev/null | cut -c 1-50 | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g'; break; fi; done
    color = $muted
    font_size = 13
    font_family = Noto Sans
    position = 0, -235
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then printf '‹‹'; break; fi; done
    onclick = for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then playerctl -p "$p" previous; break; fi; done
    color = $muted
    font_size = 24
    font_family = Noto Sans
    position = -65, -285
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then printf 'Ⅱ'; break; fi; done
    onclick = for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then playerctl -p "$p" pause; break; fi; done
    color = $orange
    font_size = 24
    font_family = Noto Sans
    position = 0, -285
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then printf '››'; break; fi; done
    onclick = for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = Playing ]; then playerctl -p "$p" next; break; fi; done
    color = $muted
    font_size = 24
    font_family = Noto Sans
    position = 65, -285
    halign = center
    valign = center
}
